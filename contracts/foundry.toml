[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.36"
auto_detect_solc = false
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
no_match_path = "test/fork/**"

[profile.fork]
match_path = "test/fork/**"
no_match_path = "test/__no_fork_exclude/**"

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
