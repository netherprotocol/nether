name: web

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
