name: contracts

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  fork:
    if: ${{ secrets.BASE_RPC_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge test --match-path 'test/fork/**' --fork-url "$BASE_RPC_URL" -vvv
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
