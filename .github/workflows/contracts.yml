name: contracts

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  fork:
    runs-on: ubuntu-latest
    env:
      HAS_BASE_RPC_URL: ${{ secrets.BASE_RPC_URL != '' }}
    steps:
      - name: Skip fork tests when BASE_RPC_URL is unset
        if: ${{ env.HAS_BASE_RPC_URL != 'true' }}
        run: echo "BASE_RPC_URL is not set; skipping fork tests."
      - uses: actions/checkout@v7
        if: ${{ env.HAS_BASE_RPC_URL == 'true' }}
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        if: ${{ env.HAS_BASE_RPC_URL == 'true' }}
        with:
          version: v1.7.1
      - name: Run Base fork tests
        if: ${{ env.HAS_BASE_RPC_URL == 'true' }}
        working-directory: contracts
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          FOUNDRY_PROFILE: fork
        run: forge test --fork-url "$BASE_RPC_URL" -vvv
